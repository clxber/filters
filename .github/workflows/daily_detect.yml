name: Daily Proxy Health Check

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00（北京时间 08:00）运行
  workflow_dispatch:      # 允许手动触发

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # ★ 先拉取远程最新更改，此时工作区是干净的
      - name: Pull latest changes from remote
        run: git pull --rebase origin main

      - name: Ensure scripts directory exists
        run: mkdir -p scripts

      - name: Run detection script
        run: python3 scripts/detect.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.txt daily_reports/ status.json valid_10days.txt
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily health check $(date -u '+%Y-%m-%d')"
            git push origin main
          fi
