name: Collect and Merge Proxy Lists (China only, cumulative)

on:
  schedule:
    - cron: '*/10 * * * *'   # 每10分钟运行一次
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download latest proxy files
        run: |
          FILES=("http.txt" "https.txt" "socks4.txt" "socks5.txt" "connect.txt")
          for file in "${FILES[@]}"; do
            echo "Downloading $file ..."
            curl -f -s -o "new_$file" "https://raw.githubusercontent.com/zloi-user/hideip.me/main/$file" || echo "Warning: Failed to download $file, creating empty file"
            if [ ! -f "new_$file" ]; then
              touch "new_$file"
            fi
          done
          ls -la new_*.txt

      - name: Merge new proxies with existing (cumulative, deduplicated)
        run: |
          python3 << 'EOF'
          import os
          from collections import defaultdict

          # ---------- 处理协议文件（http, https, socks4, socks5） ----------
          proto_map = {
              'http.txt': 'http',
              'https.txt': 'https',
              'socks4.txt': 'socks4',
              'socks5.txt': 'socks5',
          }

          # 读取本地已有协议文件（格式 IP:PORT:Country）
          existing_proxies = {proto: set() for proto in proto_map.values()}
          for filename, proto in proto_map.items():
              if os.path.exists(filename):
                  with open(filename, 'r', encoding='utf-8', errors='ignore') as f:
                      for line in f:
                          line = line.strip()
                          if line:
                              existing_proxies[proto].add(line)

          # 解析新下载的协议文件，提取 China 代理
          new_proxies = {proto: set() for proto in proto_map.values()}
          proxy_country = {}  # IP:PORT -> Country

          for filename, proto in proto_map.items():
              new_filename = f"new_{filename}"
              if not os.path.exists(new_filename):
                  continue
              with open(new_filename, 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split(':')
                      if len(parts) >= 2:
                          ip_port = f"{parts[0]}:{parts[1]}"
                          country = parts[2] if len(parts) >= 3 else None
                          if country == 'China':
                              new_proxies[proto].add(ip_port)
                              proxy_country[ip_port] = country

          # 合并协议文件（去重）
          merged_proxies = {}
          for proto in proto_map.values():
              merged = existing_proxies[proto].union(new_proxies[proto])
              merged_proxies[proto] = merged

          # 写回协议文件（格式 IP:PORT:China）
          for proto, ip_set in merged_proxies.items():
              for filename, p in proto_map.items():
                  if p == proto:
                      with open(filename, 'w', encoding='utf-8') as f:
                          for ip_port in sorted(ip_set):
                              country = proxy_country.get(ip_port, 'China')
                              f.write(f"{ip_port}:{country}\n")
                      break

          # ---------- 处理 connect.txt ----------
          # 读取本地已有 connect.txt（格式 IP:PORT:Country）
          existing_connect = set()
          if os.path.exists('connect.txt'):
              with open('connect.txt', 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      line = line.strip()
                      if line:
                          existing_connect.add(line)

          # 解析新下载的 connect.txt，只保留 China 代理
          new_connect = set()
          if os.path.exists('new_connect.txt'):
              with open('new_connect.txt', 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split(':')
                      if len(parts) >= 2:
                          ip_port = f"{parts[0]}:{parts[1]}"
                          country = parts[2] if len(parts) >= 3 else None
                          if country == 'China':
                              new_connect.add(f"{ip_port}:China")

          # 合并 connect（去重）
          merged_connect = existing_connect.union(new_connect)

          # 写回 connect.txt
          with open('connect.txt', 'w', encoding='utf-8') as f:
              for line in sorted(merged_connect):
                  f.write(line + '\n')

          # 打印统计信息
          print("协议文件合并完成")
          for proto in proto_map.values():
              print(f"{proto.upper()}: {len(merged_proxies[proto])} 个")
          print(f"CONNECT: {len(merged_connect)} 个")
          EOF

      - name: Remove temporary new_*.txt files
        run: rm -f new_*.txt

      - name: List final files (for debugging)
        run: ls -la *.txt

      - name: Check for changes and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if ! ls *.txt 1> /dev/null 2>&1; then
            touch http.txt https.txt socks4.txt socks5.txt connect.txt
          fi

          git add -f *.txt
          if git diff --staged --quiet; then
            git commit --allow-empty -m "No new proxies, but keep files"
          else
            git commit -m "Auto-update proxy lists (cumulative) at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          fi
          git push
