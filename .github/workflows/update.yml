name: Collect and Merge Proxy Lists (China only, cumulative)

on:
  schedule:
    - cron: '*/5 * * * *'          # 每5分钟运行一次
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download latest proxy files
        run: |
          FILES=("http.txt" "https.txt" "socks4.txt" "socks5.txt")
          for file in "${FILES[@]}"; do
            curl -s -o "new_$file" "https://raw.githubusercontent.com/zloi-user/hideip.me/main/$file"
          done

      - name: Merge new proxies with existing (cumulative, deduplicated)
        run: |
          python3 << 'EOF'
          import os
          from collections import defaultdict

          proto_map = {
              'http.txt': 'http',
              'https.txt': 'https',
              'socks4.txt': 'socks4',
              'socks5.txt': 'socks5',
          }

          # 1. 读取本地已有代理（如果存在），装入集合
          existing_proxies = {proto: set() for proto in proto_map.values()}
          for filename, proto in proto_map.items():
              if os.path.exists(filename):
                  with open(filename, 'r', encoding='utf-8', errors='ignore') as f:
                      for line in f:
                          line = line.strip()
                          if line:
                              existing_proxies[proto].add(line)

          # 2. 解析本次下载的新文件，提取 China 代理
          new_proxies = {proto: set() for proto in proto_map.values()}
          proxy_country = {}  # 用于过滤 China

          for filename, proto in proto_map.items():
              new_filename = f"new_{filename}"
              if not os.path.exists(new_filename):
                  continue
              with open(new_filename, 'r', encoding='utf-8', errors='ignore') as f:
                  for line in f:
                      line = line.strip()
                      if not line:
                          continue
                      parts = line.split(':')
                      if len(parts) >= 2:
                          ip_port = f"{parts[0]}:{parts[1]}"
                          country = parts[2] if len(parts) >= 3 else None
                          if country == 'China':
                              new_proxies[proto].add(ip_port)

          # 3. 合并现有 + 新代理（去重）
          merged_proxies = {}
          for proto in proto_map.values():
              merged = existing_proxies[proto].union(new_proxies[proto])
              merged_proxies[proto] = merged

          # 4. 写回文件（覆盖，但内容已是累积的）
          for proto, ip_set in merged_proxies.items():
              for filename, p in proto_map.items():
                  if p == proto:
                      with open(filename, 'w', encoding='utf-8') as f:
                          for ip_port in sorted(ip_set):
                              f.write(f"{ip_port}\n")
                      break

          print("累积合并完成")
          for proto in proto_map.values():
              print(f"{proto.upper()}: {len(merged_proxies[proto])} 个")
          EOF

      - name: List generated files (for debugging)
        run: ls -la *.txt

      - name: Check for changes and commit
        run: |
          git config user.name "github-actions[bot]"
          git config.user.email "github-actions[bot]@users.noreply.github.com"
          git add -f *.txt
          if git diff --staged --quiet; then
            git commit --allow-empty -m "No new proxies, but keep files"
          else
            git commit -m "Auto-update proxy lists (cumulative) at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          fi
          git push
