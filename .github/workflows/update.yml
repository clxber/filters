name: Collect and Merge Proxy Lists (China only, cumulative)

on:
  schedule:
    - cron: '0 * * * *'          # 每小时整点触发
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Ensure scripts directory exists
        run: mkdir -p scripts

      - name: Create collect_once.py script
        run: |
          cat > scripts/collect_once.py << 'EOF'
          #!/usr/bin/env python3
          import os
          from collections import defaultdict

          PROXY_FILES = ['http.txt', 'https.txt', 'socks4.txt', 'socks5.txt', 'connect.txt']
          PROTOCOL_MAP = {
              'http.txt': 'http',
              'https.txt': 'https',
              'socks4.txt': 'socks4',
              'socks5.txt': 'socks5',
          }

          def download_and_merge():
              import urllib.request
              import sys

              # 下载文件
              for filename in PROXY_FILES:
                  url = f"https://raw.githubusercontent.com/zloi-user/hideip.me/main/{filename}"
                  try:
                      urllib.request.urlretrieve(url, f"new_{filename}")
                      print(f"Downloaded {filename}")
                  except Exception as e:
                      print(f"Failed to download {filename}: {e}")
                      with open(f"new_{filename}", 'w') as f:
                          pass

              # ----- 处理协议文件 -----
              proto_map = PROTOCOL_MAP
              existing_ips = {proto: set() for proto in proto_map.values()}
              for filename, proto in proto_map.items():
                  if os.path.exists(filename):
                      with open(filename, 'r', encoding='utf-8', errors='ignore') as f:
                          for line in f:
                              line = line.strip()
                              if not line:
                                  continue
                              parts = line.split(':')
                              if len(parts) >= 2:
                                  ip_port = f"{parts[0]}:{parts[1]}"
                                  existing_ips[proto].add(ip_port)

              new_ips = {proto: set() for proto in proto_map.values()}
              for filename, proto in proto_map.items():
                  new_filename = f"new_{filename}"
                  if not os.path.exists(new_filename):
                      continue
                  with open(new_filename, 'r', encoding='utf-8', errors='ignore') as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          parts = line.split(':')
                          if len(parts) >= 2:
                              ip_port = f"{parts[0]}:{parts[1]}"
                              country = parts[2] if len(parts) >= 3 else None
                              if country == 'China':
                                  new_ips[proto].add(ip_port)

              merged_ips = {}
              for proto in proto_map.values():
                  merged_ips[proto] = existing_ips[proto].union(new_ips[proto])

              for proto, ip_set in merged_ips.items():
                  for filename, p in proto_map.items():
                      if p == proto:
                          with open(filename, 'w', encoding='utf-8', newline='\r\n') as f:
                              for ip_port in sorted(ip_set):
                                  f.write(f"{ip_port}:China\n")
                          break

              # ----- connect.txt -----
              existing_connect = set()
              if os.path.exists('connect.txt'):
                  with open('connect.txt', 'r', encoding='utf-8', errors='ignore') as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          parts = line.split(':')
                          if len(parts) >= 2:
                              ip_port = f"{parts[0]}:{parts[1]}"
                              existing_connect.add(ip_port)

              new_connect = set()
              if os.path.exists('new_connect.txt'):
                  with open('new_connect.txt', 'r', encoding='utf-8', errors='ignore') as f:
                      for line in f:
                          line = line.strip()
                          if not line:
                              continue
                          parts = line.split(':')
                          if len(parts) >= 2:
                              ip_port = f"{parts[0]}:{parts[1]}"
                              country = parts[2] if len(parts) >= 3 else None
                              if country == 'China':
                                  new_connect.add(ip_port)

              merged_connect = existing_connect.union(new_connect)
              with open('connect.txt', 'w', encoding='utf-8', newline='\r\n') as f:
                  for ip_port in sorted(merged_connect):
                      f.write(f"{ip_port}:China\n")

              # 清理临时文件
              for filename in PROXY_FILES:
                  if os.path.exists(f"new_{filename}"):
                      os.remove(f"new_{filename}")

              print("✅ 合并完成")
              for proto in proto_map.values():
                  print(f"{proto.upper()}: {len(merged_ips[proto])} 个")
              print(f"CONNECT: {len(merged_connect)} 个")

          if __name__ == '__main__':
              download_and_merge()
          EOF
          chmod +x scripts/collect_once.py

      - name: Run collection loop (12 times, 5 minutes interval)
        run: |
          for i in {1..12}; do
            current_hour=$(date -u +%H)
            # ★ 跳过 UTC 23 点和 0 点（共2小时），避免与检测冲突
            if [ "$current_hour" -eq 23 ] || [ "$current_hour" -eq 0 ]; then
              echo "===== Collection iteration $i skipped (hour=$current_hour UTC) to avoid conflict with detection job ====="
              if [ $i -lt 12 ]; then
                echo "Waiting 5 minutes before next check..."
                sleep 300
              fi
              continue
            fi

            echo "===== Collection iteration $i ====="
            python3 scripts/collect_once.py || echo "Collect failed, continuing..."
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            
            # ★ 先拉取远程最新，避免冲突
            git pull --rebase origin main || echo "Pull failed, but continuing..."
            
            git add -f *.txt
            
            if git diff --staged --quiet; then
              echo "No changes to commit"
            else
              git commit -m "Auto-update proxy lists (iteration $i) at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
              git push origin main
            fi
            
            if [ $i -lt 12 ]; then
              echo "Waiting 5 minutes before next iteration..."
              sleep 300
            fi
          done
